# Builds, tests and releases Kural Code Editor.
#
#  Every push to main / pull request:  tests + all builds + install checks.
#                                      Downloads are in the run's "Artifacts" (Actions tab).
#  Push a tag like v1.2.0:             the same, then ONE GitHub Release with:
#  (A tag like v1.2.0-alpha.1 or v1.2.0-beta.2 makes a "Pre-release": shown as a test version, not the latest.)
#      kural_<ver>_amd64.deb                Ubuntu 22.04 / 24.04 (x64)   - installed and opened on both
#      Kural-<ver>-macos-arm64.dmg / .zip   macOS on Apple Silicon (M1-M5) - installed from the .dmg, opened
#      Kural-<ver>-windows-x64-setup.exe    Windows 10/11 installer        - installed and opened
# "Opened" = the real window starts and is still running after 25 s (not just `kural --version`), and Kural's own
# extension finished starting (its window marker in globalStorage/kural.kural/sessions says "ready").
#      Kural-<ver>-windows-x64.zip          Windows portable
#
# The tag must match extension/package.json's version (v1.2.0 <-> "1.2.0"), or the run stops early.
name: Build Kural

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # Actions → Build Kural → Run workflow: test and build without releasing

# Read-only by default; only the release job gets more (below).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # full history: needed to check a tag is on main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm test
      - name: Dependency audit (informational, Kural has no npm dependencies)
        run: npm audit --omit=dev || true
      - name: Release signing tool works
        run: node scripts/release-key.js generate > /dev/null
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on the main branch. Releases are only made from main: merge the pull request first, then tag main."
            exit 1
          fi
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(node -p 'require("./extension/package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match extension/package.json version $want. Bump the version or fix the tag."
            exit 1
          fi

  # The same tests on macOS and Windows: code that only runs there (Windows paths, taskkill, named pipes, the Mac's
  # update swap) gets tested too. Tests that can't run on a system say "skipped" there.
  test-mac-win:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The files exactly as in git: Windows' git would turn line endings into CRLF, and the checked hashes
      # (vendored licenses, the release notes, rebrand's inputs) would no longer match.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm test

  # ---------- Ubuntu ----------
  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and install with ./install.sh (what you run at home)
        run: ./install.sh
      - name: Quick extension update (./install.sh --ext)
        run: ./install.sh --ext && test -f /usr/share/kural/resources/app/extensions/kural/lib/edit/code-reply.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.deb
            dist/kural-*-linux-x64.cdx.json
          if-no-files-found: error

  linux-check:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux, path: dist }
      - name: Install the .deb
        run: sudo apt-get update -qq && sudo apt-get install -y ./dist/kural_*_amd64.deb
      - name: Start it
        run: |
          ELECTRON_RUN_AS_NODE=1 /usr/share/kural/kural -e 'const assert=require("assert");assert.equal(process.versions.electron,"42.11.12");assert.equal(process.versions.modules,"146");console.log(process.versions)'
          kural --version
          grep -q '"nameLong": "Kural Code Editor"' /usr/share/kural/resources/app/product.json
          test -f /usr/share/kural/resources/app/extensions/kural/package.json
          test -f /usr/share/applications/kural.desktop
      - name: Open the window
        run: |
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          DISPLAY=:99 /usr/share/kural/kural --disable-workspace-trust --user-data-dir /tmp/ud /tmp > /tmp/kural.log 2>&1 &
          sleep 25
          pgrep -af -- "--type=renderer" || { echo "::error::Kural quit or didn't open a window"; cat /tmp/kural.log; exit 1; }
          # Kural's own extension started completely: its window marker says "ready" (end of activate()). Kural is off in Restricted Mode, so the app starts with --disable-workspace-trust.
          S=/tmp/ud/User/globalStorage/kural.kural/sessions
          for i in $(seq 1 35); do grep -qs '"ready":' $S/*.json && break; sleep 1; done
          grep -qs '"ready":' $S/*.json || { echo "::error::Kural's extension didn't finish starting"; ls -la $S; find /tmp/ud/logs -name 'exthost*.log' -exec cat {} +; exit 1; }
          pkill -x kural || true

  # ---------- macOS (Apple Silicon) ----------
  macos:
    needs: test
    runs-on: macos-latest        # Apple Silicon machine: signs with Apple's own codesign, makes the .dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # Like a fresh Mac: macOS's own old bash (3.2), no Pillow (the icon comes from macOS's sips and iconutil)
      - name: Build and install with ./install.sh (what you run at home)
        run: /bin/bash ./install.sh --no-open && test -x /Applications/Kural.app/Contents/MacOS/Kural
      - name: Quick extension update (./install.sh --ext)
        run: |
          /bin/bash ./install.sh --ext --no-open
          codesign --verify --deep --strict /Applications/Kural.app
      - name: Install from the .dmg, check the signature, open it
        run: |
          # Exactly what a user does: copy Kural out of the .dmg, then open it.
          hdiutil attach -nobrowse -mountpoint /tmp/kural-dmg dist/*.dmg
          ditto /tmp/kural-dmg/Kural.app "$RUNNER_TEMP/Kural.app"
          # GitHub's macOS runners often return EBUSY (exit 16) if we detach at once.
          MP=/tmp/kural-dmg
          for try in 1 2 3; do
            hdiutil detach "$MP" && break || sleep $(( try * 2 ))
          done
          if mount | grep -qF "$MP"; then
            for try in 1 2 3; do
              hdiutil detach -force "$MP" && break || sleep $(( try * 2 ))
            done
          fi
          mount | grep -qF "$MP" && { echo "::error::Could not detach $MP"; hdiutil info; exit 1; }
          APP="$RUNNER_TEMP/Kural.app"
          codesign --verify --deep --strict "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Kural" -e 'const assert=require("assert");assert.equal(process.versions.electron,"42.11.12");assert.equal(process.versions.modules,"146");console.log(process.versions)'
          "$APP/Contents/Resources/app/bin/kural" --version
          # The real window, not just the command line: it must still run after 25 s with its helper processes.
          # (Electron finds its helpers by the app's name; a wrong name makes it quit at once.)
          "$APP/Contents/MacOS/Kural" --disable-workspace-trust --user-data-dir "$RUNNER_TEMP/ud" --extensions-dir "$RUNNER_TEMP/ext" "$RUNNER_TEMP" > "$RUNNER_TEMP/kural.log" 2>&1 &
          sleep 25
          ps ax -o pid,command | grep -F "Kural Helper (Renderer)" | grep -v grep || {
            echo "::error::Kural quit or didn't open a window"; cat "$RUNNER_TEMP/kural.log"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null; exit 1; }
          # Kural's own extension started completely: its window marker says "ready" (end of activate()). Kural is off in Restricted Mode, so the app starts with --disable-workspace-trust.
          S="$RUNNER_TEMP/ud/User/globalStorage/kural.kural/sessions"
          for i in $(seq 1 35); do grep -qs '"ready":' "$S"/*.json && break; sleep 1; done
          grep -qs '"ready":' "$S"/*.json || { echo "::error::Kural's extension didn't finish starting"; ls -la "$S"
            find "$RUNNER_TEMP/ud/logs" -name 'exthost*.log' -exec cat {} +; exit 1; }
          pkill -x Kural || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/Kural-*-macos-*
            dist/kural-*-macos-arm64.cdx.json
          if-no-files-found: error

  # ---------- Windows ----------
  windows:
    needs: test
    runs-on: ubuntu-24.04        # the installer is made with NSIS, which runs on Linux
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    # Code signing (Windows SmartScreen's "Windows protected your PC"): set these in Settings → Secrets and variables →
    # Actions once there's a certificate (docs/windows-signing.md). Only v* tag pushes receive real signing
    # credentials. PR, main and manual builds stay unsigned; the disposable signing check still runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1   # for jsign, which signs Windows programs on Linux
        with: { distribution: temurin, java-version: 21 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil nsis zip
      - name: Get jsign 7.5 (checked against its known SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
          echo "JSIGN_JAR=$RUNNER_TEMP/jsign.jar" >> "$GITHUB_ENV"
      # Every build: the signing step works (a throwaway certificate; nothing it makes is published).
      - run: ./scripts/sign-win-check.sh
      - name: Build (signed when a certificate is set up)
        id: build
        env:
          KURAL_SIGN_STORETYPE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_STORETYPE || '' }}
          KURAL_SIGN_KEYSTORE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_KEYSTORE || '' }}
          KURAL_SIGN_STOREPASS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_STOREPASS || '' }}
          KURAL_SIGN_ALIAS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_ALIAS || '' }}
          KURAL_SIGN_KEYPASS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_KEYPASS || '' }}
          KURAL_SIGN_TSA: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_TSA || '' }}
          SIGN_PFX_BASE64: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PFX_BASE64 || '' }}
          AZURE_TENANT_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          # A .pfx kept as a secret (base64): to a file only this job can read.
          if [ -n "$SIGN_PFX_BASE64" ]; then
            umask 077; echo "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
            export KURAL_SIGN_KEYSTORE="$RUNNER_TEMP/sign.pfx" KURAL_SIGN_STORETYPE="${KURAL_SIGN_STORETYPE:-PKCS12}"
          fi
          # Azure Artifact Signing: an access token for the signing service, from its service principal.
          if [ "$KURAL_SIGN_STORETYPE" = TRUSTEDSIGNING ] && [ -n "$AZURE_CLIENT_ID" ]; then
            az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" >/dev/null
            KURAL_SIGN_STOREPASS="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
            echo "::add-mask::$KURAL_SIGN_STOREPASS"; export KURAL_SIGN_STOREPASS
          fi
          ./build-win.sh
          if [ -n "$KURAL_SIGN_STORETYPE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/Kural-*-windows-*
            dist/kural-*-windows-x64.cdx.json
          if-no-files-found: error

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: dist }
      - name: Install silently and start it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Kural-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\Programs\Kural"
          if (-not (Test-Path "$dir\Kural.exe")) { throw "Kural.exe not installed" }
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $probe = "$env:RUNNER_TEMP\electron-runtime-check.js"
            # GUI-subsystem executables do not reliably populate LASTEXITCODE. Wait for the actual process.
            Set-Content -LiteralPath $probe -Value 'process.exit(7)' -Encoding utf8
            $p = Start-Process -FilePath "$dir\Kural.exe" -ArgumentList ('"' + $probe + '"') -Wait -PassThru
            if ($p.ExitCode -ne 7) { throw "Runtime probe did not propagate a failing exit code" }
            Set-Content -LiteralPath $probe -Value 'const assert=require("assert");assert.equal(process.versions.electron,"42.11.12");assert.equal(process.versions.modules,"146");console.log(process.versions)' -Encoding utf8
            $p = Start-Process -FilePath "$dir\Kural.exe" -ArgumentList ('"' + $probe + '"') -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\electron-runtime.log" -RedirectStandardError "$env:RUNNER_TEMP\electron-runtime.err"
            Get-Content "$env:RUNNER_TEMP\electron-runtime.log"
            Get-Content "$env:RUNNER_TEMP\electron-runtime.err"
            if ($p.ExitCode -ne 0) { throw "Patched Electron runtime check failed ($($p.ExitCode))" }
          } finally { Remove-Item Env:ELECTRON_RUN_AS_NODE }
          & "$dir\bin\kural.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "kural --version failed" }
          # The real window: still running after 25 s, with its helper processes
          Start-Process -FilePath "$dir\Kural.exe" -ArgumentList "--disable-workspace-trust", "--user-data-dir", "$env:RUNNER_TEMP\ud", "$env:RUNNER_TEMP"
          Start-Sleep -Seconds 25
          $procs = @(Get-Process Kural -ErrorAction SilentlyContinue)
          Write-Host "Kural processes running: $($procs.Count)"
          if ($procs.Count -lt 2) { throw "Kural quit or didn't open a window" }
          # Kural's own extension started completely: its window marker says "ready" (end of activate()). Kural is off in Restricted Mode, so the app starts with --disable-workspace-trust.
          $S = "$env:RUNNER_TEMP\ud\User\globalStorage\kural.kural\sessions"
          $ready = $false
          for ($i = 0; $i -lt 35 -and -not $ready; $i++) {
            $ready = [bool](Get-ChildItem "$S\*.json" -ErrorAction SilentlyContinue | Select-String -SimpleMatch '"ready":' -Quiet)
            if (-not $ready) { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) {
            Get-ChildItem $S -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP\ud\logs" -Recurse -Filter 'exthost*.log' -ErrorAction SilentlyContinue | Get-Content
            throw "Kural's extension didn't finish starting"
          }
          $procs | Stop-Process -Force
      - name: Signed (when a certificate is set up)
        if: needs.windows.outputs.signed == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Kural-*-setup.exe | Select-Object -First 1
          foreach ($f in @($setup.FullName, "$env:LOCALAPPDATA\Programs\Kural\Kural.exe", "$env:LOCALAPPDATA\Programs\Kural\Uninstall Kural.exe")) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne "Valid") { throw "$f isn't validly signed: $($s.StatusMessage)" }
          }
      - name: Uninstall (refused while Kural runs; your data stays unless you ask)
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Kural"; $data = "$env:APPDATA\Kural"
          # (The uninstaller copies itself to the temp folder and runs from there: wait for the program file to go.)
          function Wait-Gone($p, $s) { for ($i = 0; $i -lt $s -and (Test-Path -LiteralPath $p); $i++) { Start-Sleep -Seconds 1 }; -not (Test-Path -LiteralPath $p) }
          New-Item -ItemType Directory -Force -Path "$data\User" | Out-Null
          Set-Content -LiteralPath "$data\User\settings.json" -Value '{}'
          # Kural running: nothing is removed.
          $k = Start-Process -FilePath "$dir\Kural.exe" -ArgumentList "--disable-workspace-trust", "--user-data-dir", "$env:RUNNER_TEMP\ud2", "$env:RUNNER_TEMP" -PassThru
          Start-Sleep -Seconds 10
          Start-Process -FilePath "$dir\Uninstall Kural.exe" -ArgumentList '/S'
          Start-Sleep -Seconds 15
          if (-not (Test-Path "$dir\Kural.exe")) { throw "the uninstaller removed Kural while it was running" }
          Get-Process Kural -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          # Closed: the program goes, your data stays.
          Start-Process -FilePath "$dir\Uninstall Kural.exe" -ArgumentList '/S'
          if (-not (Wait-Gone "$dir\Kural.exe" 90)) { throw "the uninstaller didn't remove Kural" }
          if (-not (Test-Path "$data\User\settings.json")) { throw "the uninstaller deleted your data without being asked" }
          # Again with /REMOVEDATA (the "Your Kural data" box): the data goes too.
          $setup = Get-ChildItem dist\Kural-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          Start-Process -FilePath "$dir\Uninstall Kural.exe" -ArgumentList '/S', '/REMOVEDATA'
          if (-not (Wait-Gone "$dir\Kural.exe" 90)) { throw "the uninstaller didn't remove Kural" }
          if (-not (Wait-Gone $data 30)) { throw "/REMOVEDATA left $data" }
          Write-Host "Uninstall checks passed"

  # ---------- Release (tags only) ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-mac-win, linux-check, macos, windows-check]
    runs-on: ubuntu-24.04
    # The GitHub environment "release" (deployment tags v* only): a workflow changed on a branch can't read its secrets.
    # Releases up to 1.1.0 are still signed with key #0, the repository secret KURAL_RELEASE_PRIVATE_KEY (rc.1 and older
    # trust only that key). After 1.1.0 this job signs with KURAL_RELEASE_PRIVATE_KEY_NEW (key #1, only in this
    # environment) and the repository secret is deleted: docs/release-signing.md.
    environment: release
    permissions:
      contents: write       # publish the release
      id-token: write       # build provenance (signed statement of where the files were built)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - name: Check the release doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are never changed after they are published: a fix is a new version.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Releases are never changed; make a new version."
            exit 1
          fi
      - name: Sign the checksum list
        env:
          KURAL_RELEASE_PRIVATE_KEY: ${{ secrets.KURAL_RELEASE_PRIVATE_KEY }}
        run: |
          # The updater installs nothing that isn't in this list (see docs/release-signing.md)
          node scripts/sbom-release.js dist   # refuses missing/source-only platform inventories
          (cd dist && sha256sum Kural-* kural_* kural-*.cdx.json > SHA256SUMS)
          node scripts/release-key.js sign dist/SHA256SUMS
          node scripts/release-key.js verify dist/SHA256SUMS dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="$GITHUB_REF_NAME"
          ./scripts/release-notes.sh "${tag#v}" > notes.md
          title="Kural Code Editor $tag"
          prerelease=false
          case "$tag" in *-*) prerelease=true; title="$title (test version)";; esac
          echo "Creating release $tag"
          gh release create "$tag" dist/* --title "$title" --notes-file notes.md --prerelease="$prerelease" --verify-tag
