# Builds, tests and releases Kural Code Editor.
#
#  Every push to main / pull request:  tests + all builds + install checks.
#                                      Downloads are in the run's "Artifacts" (Actions tab).
#  Push a tag like v1.2.0:             the same, then ONE GitHub Release with:
#      kural_<ver>_amd64.deb                Ubuntu 22.04 / 24.04 (x64)   - installed and started on both
#      Kural-<ver>-macos-arm64.dmg / .zip   macOS on Apple Silicon (M1-M5) - signature checked, started
#      Kural-<ver>-windows-x64-setup.exe    Windows 10/11 installer        - installed and started
#      Kural-<ver>-windows-x64.zip          Windows portable
#
# The tag must match extension/package.json's version (v1.2.0 <-> "1.2.0"), or the run stops early.
name: Build Kural

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(node -p 'require("./extension/package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match extension/package.json version $want. Bump the version or fix the tag."
            exit 1
          fi

  # ---------- Ubuntu ----------
  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - run: ./make-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.deb, if-no-files-found: error }

  linux-check:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: linux, path: dist }
      - name: Install the .deb
        run: sudo apt-get update -qq && sudo apt-get install -y ./dist/kural_*_amd64.deb
      - name: Start it
        run: |
          kural --version
          grep -q '"nameLong": "Kural Code Editor"' /usr/share/kural/resources/app/product.json
          test -f /usr/share/kural/resources/app/extensions/kural/package.json
          test -f /usr/share/applications/kural.desktop

  # ---------- macOS (Apple Silicon) ----------
  macos:
    needs: test
    runs-on: macos-latest        # Apple Silicon machine: signs with Apple's own codesign, makes the .dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: ./build-mac.sh
      - name: Check the signature and start it
        run: |
          APP=build/mac/Kural.app
          codesign --verify --deep --strict "$APP"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/VSCodium" -e \
            'const p = require(process.argv[1]); console.log(p.nameLong, p.version); if (p.nameLong !== "Kural Code Editor") process.exit(1)' \
            "$PWD/$APP/Contents/Resources/app/product.json"
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/Kural-*-macos-*", if-no-files-found: error }

  # ---------- Windows ----------
  windows:
    needs: test
    runs-on: ubuntu-24.04        # the installer is made with NSIS, which runs on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil nsis zip
      - run: ./build-win.sh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/Kural-*-windows-*", if-no-files-found: error }

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows, path: dist }
      - name: Install silently and start it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Kural-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\Programs\Kural"
          if (-not (Test-Path "$dir\Kural.exe")) { throw "Kural.exe not installed" }
          & "$dir\bin\kural.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "kural --version failed" }

  # ---------- Release (tags only) ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-check, macos, windows-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kural Code Editor $GITHUB_REF_NAME" --notes-file notes.md
