# OpenSSF Scorecard: grades the repository's security habits (pinned actions, token permissions…) and publishes it.
name: scorecard
on:
  push: { branches: [main] }
  branch_protection_rule:
  schedule: [{ cron: "23 4 * * 3" }]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload the results
      id-token: write          # publish them
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with: { sarif_file: results.sarif }
